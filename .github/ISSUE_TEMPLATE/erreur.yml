name: Signaler une erreur ou une imprécision
description: Contester un chiffre, une citation, une note ou une interprétation sur une fiche existante.
title: "[nom-de-la-fiche] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Merci pour votre vigilance. Pour que nous puissions vérifier et corriger rapidement, indiquez systématiquement la **source primaire** (loi, rapport officiel, série Insee/DGFiP, étude évaluative publiée).
  - type: input
    id: fiche
    attributes:
      label: Fiche concernée
      description: Nom du dispositif ou lien vers la page sur service-apres-vote.fr
      placeholder: ex. credit-impot-recherche
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Quel est le point contesté ou erroné ?
      description: Précisez l'effet, l'axe (engagement, mesure, effet) ou l'année concernée.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source primaire vérifiable
      description: Lien officiel, titre du document, année et numéro de page ou de tableau.
    validations:
      required: true
